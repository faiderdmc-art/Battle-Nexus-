html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,sans-serif;max-width:560px;margin:auto;padding-bottom:70px}
header{display:flex;justify-content:space-between;padding:12px 14px;font-weight:700;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.pill{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:4px 10px}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:10px 0;font-size:10px}
nav button.on{color:var(--ac);font-weight:700}
main{padding:0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
button.b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
button.b:disabled{opacity:.4}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lv{padding:10px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-weight:700}
.lv.boss{border-color:#e8a400;background:#fff3c4;color:#6a4a00}
.lv.cur{outline:2px solid var(--ac)}
.lv.lock{opacity:.35}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:none}
.row{display:flex;gap:10px;align-items:center}
.R-N{--c:#9aa;background:linear-gradient(135deg,#cfd8dc,#90a4ae)}
.R-R{background:linear-gradient(135deg,#a5d8ff,#4dabf7)}
.R-SR{background:linear-gradient(135deg,#d0b0ff,#9c5cff)}
.R-SSR{background:linear-gradient(135deg,#ffe27a,#ff8a3d);box-shadow:0 0 12px #ffb347}
.tag{font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;background:#0002}
.bar{height:10px;background:#0002;border-radius:6px;overflow:hidden;margin:3px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5d7a,#ff9f5d);transition:width .3s}
.bar.p i{background:linear-gradient(90deg,#3ddc97,#4dd0e1)}
.mu{color:var(--mu);font-size:12px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:calc(12px + env(safe-area-inset-top,0px)) 12px 20px;max-width:560px;margin:auto}
.big{font-size:64px;text-align:center}
.log{height:84px;overflow:auto;font-size:12px;color:var(--mu)}
.pulls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pulls div{text-align:center;padding:6px 2px;border-radius:10px;font-size:11px}
.pulls .av{width:100%;height:auto;aspect-ratio:1;border-radius:10px;font-size:24px}
.av{overflow:hidden}.av svg{width:100%;height:100%;display:block}
.big svg{width:150px;height:175px}.g:disabled{opacity:.4}.g.sel:disabled{opacity:1}.sw{flex:1;padding:6px 2px}
.sel{outline:3px solid var(--ac)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hit{animation:sh .25s}

body{background:linear-gradient(135deg,#ffd6ec,#d6c8ff 50%,#c8ecff);background-size:300% 300%;animation:bg 14s ease infinite}

#pt{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
#pt span{position:absolute;top:-24px;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(400deg)}}

.stage{text-align:center;color:#fff;position:relative;width:200px;height:200px;display:grid;place-items:center}
.ring{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px;border-radius:50%;border:4px dashed #ff9ecb;animation:spin 1.2s linear infinite;box-shadow:0 0 40px #ff4f9a,inset 0 0 40px #7c5cff}
.ring.r2{width:140px;height:140px;margin:-70px;animation-direction:reverse;border-color:#8be9ff}
.spark{font-size:80px;animation:pul .6s infinite}.spark.shake{animation:shk .12s infinite}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes pul{50%{transform:scale(1.2)}}@keyframes shk{25%{transform:rotate(-9deg) scale(1.1)}75%{transform:rotate(9deg) scale(1.1)}}
@keyframes pop{from{transform:scale(0) rotate(-25deg);opacity:0}to{transform:scale(1);opacity:1}}
.cds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:440px}.cds.one{grid-template-columns:1fr;max-width:150px;margin:auto}
.rc{text-align:center;color:#2a1a33;font-size:11px;border-radius:12px;padding:6px 2px;animation:pop .5s both}
.rface{border-radius:50%;overflow:hidden;aspect-ratio:1}.rem{font-size:30px;aspect-ratio:1;display:grid;place-items:center}
.flash{position:fixed;inset:0;background:#fff;animation:fo .7s forwards;pointer-events:none}@keyframes fo{to{opacity:0}}
.skfx{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}.skfx::before{content:'';position:absolute;inset:0;background:var(--c);opacity:0;animation:flr 1.1s}
